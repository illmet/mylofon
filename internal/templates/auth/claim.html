{{define "auth/claim.html"}}
<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Mylofon</title>
    <link rel="stylesheet" href="/static/css/main.css">
</head>

<body class="auth-body">
    <div class="auth-container">
        <h1 class="auth-logo">mylofon</h1>
        <p class="auth-subtitle">Claim your spot</p>

        {{if .Error}}
        <div class="alert alert-error">{{.Error}}</div>
        {{end}}

        <form action="/auth/check" method="post" class="auth-form">
            <div class="form-group">
                <label for="claim_id">Your Claim ID</label>
                <div class="input-prefix">
                    <span>@</span>
                    <input type="text" id="claim_id" name="claim_id" placeholder="username" pattern="[a-zA-Z0-9_]{3,20}"
                        required autofocus>
                </div>
                <small>3-20 characters, letters, numbers, underscores</small>
            </div>
            <button type="submit" class="btn btn-primary btn-large">Continue</button>
        </form>
    </div>

    <script src="/static/js/app.js"></script>
</body>

</html>
{{end}}
